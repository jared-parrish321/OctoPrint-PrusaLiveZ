[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-PrusaLiveZ"
version = "1.0.0"
description = "Read and set Live Adjust Z per sheet, switch sheets, nudge Z mid-print and run a calibration ladder on Prusa MK3/MK2.5 printers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jared-parrish321" }]
requires-python = ">=3.10,<4"
# OctoPrint itself is deliberately not listed; the plugin runs inside it.
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout",
    "hypothesis",
    "syrupy",
]

[project.urls]
Homepage = "https://github.com/jared-parrish321/OctoPrint-PrusaLiveZ"

[project.entry-points."octoprint.plugin"]
prusa_livez = "octoprint_prusa_livez"

[tool.setuptools.packages.find]
include = ["octoprint_prusa_livez*"]

[tool.setuptools.package-data]
"*" = ["*.jinja2", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60  # a test waiting on a printer reply must not hang CI

[tool.coverage.run]
branch = true
